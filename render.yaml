services:
  - type: web
    name: event-management-backend
    runtime: python
    buildCommand: "pip install uv && uv pip install --system -e ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: event-db
          property: connectionString

databases:
  - name: event-db
    plan: free
